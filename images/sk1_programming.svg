<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 115" role="img" aria-label="A short Python function and its result"><rect width="172" height="115" fill="#ffffff"/><g font-family="Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="10.6"><text x="7" y="34" xml:space="preserve"><tspan fill="#b01c1c">def </tspan><tspan fill="#1b45a8">grow</tspan><tspan fill="#2b2d33">(x, k, dt):</tspan></text><text x="7" y="52" xml:space="preserve"><tspan fill="#b01c1c">    return </tspan><tspan fill="#2b2d33">x + k*x*dt</tspan></text><text x="7" y="70" xml:space="preserve"><tspan fill="#1b45a8">print</tspan><tspan fill="#2b2d33">(grow(</tspan><tspan fill="#12703a">1.0</tspan><tspan fill="#2b2d33">, </tspan><tspan fill="#12703a">0.5</tspan><tspan fill="#2b2d33">, </tspan><tspan fill="#12703a">0.1</tspan><tspan fill="#2b2d33">))</tspan></text><text x="7" y="93" xml:space="preserve"><tspan fill="#6b7078">1.05</tspan></text></g><line x1="7" y1="77" x2="165" y2="77" stroke="#d5d8de" stroke-width="0.8"/></svg>
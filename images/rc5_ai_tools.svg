<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Researcher directing an AI agent and validating its output in a loop">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1c33"/><stop offset="1" stop-color="#1b3a63"/></linearGradient>
    <marker id="ah5" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#c9a24a"/></marker>
  </defs>
  <rect width="400" height="200" fill="url(#bg5)"/>
  <text x="200" y="24" text-anchor="middle" fill="#eaf1fb" font-family="Georgia, serif" font-size="14">Specify, generate, validate</text>
  <!-- boxes -->
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="22" y="70" width="98" height="56" rx="8" fill="none" stroke="#c9a24a" stroke-width="2"/>
    <text x="71" y="94" fill="#c9a24a" font-size="12">Researcher</text>
    <text x="71" y="110" fill="#9fb6d6" font-size="10">algorithm &#183; spec</text>
    <rect x="151" y="70" width="98" height="56" rx="8" fill="none" stroke="#14b8a1" stroke-width="2"/>
    <text x="200" y="94" fill="#14b8a1" font-size="12">AI agent</text>
    <text x="200" y="110" fill="#9fb6d6" font-size="10">code &#183; drafts</text>
    <rect x="280" y="70" width="98" height="56" rx="8" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <text x="329" y="94" fill="#7dd3fc" font-size="12">Validation</text>
    <text x="329" y="110" fill="#9fb6d6" font-size="10">tests &#183; analytics</text>
  </g>
  <!-- forward arrows -->
  <g stroke="#c9a24a" stroke-width="2" marker-end="url(#ah5)">
    <line x1="122" y1="98" x2="145" y2="98"/>
    <line x1="251" y1="98" x2="274" y2="98"/>
  </g>
  <!-- feedback loop -->
  <path d="M329 128 C329 172 71 172 71 134" fill="none" stroke="#c9a24a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah5)"/>
  <text x="200" y="182" text-anchor="middle" fill="#9fb6d6" font-family="sans-serif" font-size="10">check every output, then refine</text>
</svg>
